- id: 2026-taslp-shi
  title: 'Beyond Acoustic Prefixes: Persistent Access to Serialized Acoustic Memory for LLM-Based Multi-Talker Speech Recognition'
  authors: Hao Shi, Yuan Gao, Xugang Lu, Tatsuya Kawahara
  venue: IEEE TASLP
  venue_full: IEEE Transactions on Audio, Speech and Language Processing
  year: 2026
  type: journal
  themes:
  - attribution
  - grounded
  selected: true
  summary: Proposes memory grounding to improve large language model-based recognition in overlapping multi-talker speech.
  figure: /assets/figures/2026-taslp-shi.webp
  links:
    arxiv: https://arxiv.org/abs/2603.27205
    doi: https://doi.org/10.1109/TASLPRO.2026.3742215
    code: https://github.com/hshi-speech/grounded-multitalker-asr
    bibtex: /files/bib/2026-taslp-shi.txt
  details:
  - label: Motivation
    text: LLMs bring strong linguistic priors to serialized output training (SOT), yet LLM-based multi-talker ASR degrades substantially as the number of overlapping talkers grows. Acoustic evidence is exposed mainly through an initial mixture prefix, so the decoder must preserve and recover talker-relevant information indirectly throughout generation. Enriching that static prefix with CTC tokens, hybrid prompts, or continuous talker representations does not fully remove this bottleneck.
  - label: Method
    text: Onset-based serialization is extended from the output target to the acoustic-conditioning pathway. Talker-specific representations are kept in utterance-onset order as external acoustic memory, and LLM layers query this memory throughout generation via gated residual cross-attention, while the mixture prefix remains a complementary global path. A second adaptation stage applies low-rank updates to the retrieval pathway and selected self-attention projections.
  - label: Results
    text: 'Experiments on LibriMix show consistent improvements over static-prefix prompting: effective LLM-based multi-talker ASR depends not only on richer acoustic representations, but also on persistent access to evidence structured according to the serialized output.'
  abstract: Large language models (LLMs) provide strong linguistic priors for serialized output training (SOT), yet LLM-based multi-talker ASR degrades substantially as the number of overlapping talkers increases. Conventional systems expose acoustic evidence primarily through an initial projected mixture prefix, requiring the decoder to preserve and recover talker-relevant information indirectly throughout autoregressive generation. We first examine whether this limitation can be resolved by enriching the static prefix using discrete connectionist temporal classification (CTC) tokens, hybrid token--acoustic prompts, and continuous talker-specific representations. The results suggest that acoustic content alone does not fully address the conditioning bottleneck. We therefore extend onset-based serialization from the output target to the acoustic-conditioning pathway and introduce persistent decoder-side access to SOT-aligned serialized acoustic memory. Talker-specific representations are organized in utterance-onset order and retained as external acoustic memory, while the conventional mixture prefix provides a complementary global-conditioning path. LLM layers query this memory throughout generation through gated residual cross-attention. We further introduce a second adaptation stage that jointly applies low-rank updates to the acoustic-retrieval pathway and selected LLM self-attention projections. Experiments on LibriMix show consistent improvements over static-prefix prompting. These results indicate that effective LLM-based multi-talker ASR depends not only on providing richer acoustic representations, but also on maintaining persistent access to acoustic evidence structured according to the serialized output.
- id: tac-2025_gao
  title: 'Bridging Speech Emotion Recognition and Personality: Dataset and Temporal Interaction Condition Network'
  authors: Yuan Gao, Hao Shi, Yahui Fu, Chenhui Chu, Tatsuya Kawahara
  venue: IEEE TAFFC
  venue_full: IEEE Transactions on Affective Computing, vol. 17, no. 1, pp. 829–840
  year: 2026
  type: journal
  themes:
  - other
  figure: /assets/figures/tac-2025_gao.webp
  links:
    arxiv: https://arxiv.org/abs/2505.13978
    doi: https://doi.org/10.1109/TAFFC.2025.3637088
    bibtex: /files/bib/tac-2025_gao.txt
  abstract: This study investigates the interaction between personality traits and emotion expression, exploring how personality information can improve speech emotion recognition (SER). We collect the personality annotation for the IEMOCAP dataset, making it the first speech dataset that contains both emotion and personality annotations (PA-IEMOCAP), and enabling direct integration of personality traits into SER. Statistical analysis on this dataset identified significant correlations between personality traits and emotional expressions. To extract finegrained personality features, we propose a temporal interaction condition network (TICN), in which personality features are integrated with HuBERT-based acoustic features for SER. Experiments show that incorporating ground-truth personality traits significantly enhances valence recognition, improving the concordance correlation coefficient (CCC) from 0.698 to 0.785 compared to the baseline without personality information. For practical applications in dialogue systems where personality information about the user is unavailable, we develop a front-end module of automatic personality recognition. Using these automatically predicted traits as inputs to our proposed TICN model, we achieve a CCC of 0.776 for valence recognition, representing an 11.17% relative improvement over the baseline. These findings confirm the effectiveness of personality-aware SER and provide a solid foundation for further exploration in personality-aware speech processing applications.
- id: 2026-shi-ruby
  title: 'Ruby-ASR: Evidence-Preserving Supervision for Joint Orthographic and Lexical-Reading Recognition'
  authors: Hao Shi, Yun Liu, Xuehao Yang, Jun Liu, Chuanbo Hua, Xuanjun Chen, Lianbo Liu, Shiao Zhu, Zixiong Su
  venue: arXiv
  venue_full: arXiv preprint arXiv:2609.27289
  year: 2026
  type: preprint
  themes:
  - grounded
  selected: true
  summary: Refines the Japanese ASR target into a span-bound sequence that binds each written span to its realized reading.
  figure: /assets/figures/2026-shi-ruby.webp
  links:
    arxiv: https://arxiv.org/abs/2609.27289
    code: https://github.com/hshi-speech/Ruby-ASR-1.7B
    models: https://huggingface.co/hshispeech/Ruby-ASR-1.7B
    bibtex: /files/bib/2026-shi-ruby.txt
  details:
  - label: Motivation
    text: Japanese ASR is conventionally supervised by an orthographic transcript, although one written form can correspond to different lexical readings in speech. The reading distinction is absent from the supervision and cannot be recovered reliably by post-hoc, text-only grapheme-to-phoneme conversion.
  - label: Method
    text: 'The target is refined into a span-bound orthographic and lexical-reading sequence: each written span is locally bound to its realized reading, and both views can be recovered deterministically. Built on a Qwen3-ASR backbone under subtitle-style and verbatim-style conventions, with a mora-level CTC objective as auxiliary monotonic reading supervision.'
  - label: Results
    text: Across five Japanese benchmarks, refining the recognition target improves lexical-reading recovery without sacrificing readable orthographic transcription. Checkpoints and inference code are released.
  abstract: Conventional Japanese automatic speech recognition (ASR) is supervised by an orthographic transcript, although the same written form can correspond to different lexical readings realized in speech. Such utterances receive an identical target, so their reading distinction is absent from the supervision interface and cannot be recovered reliably by post-hoc text-only grapheme-to-phoneme conversion. We present Ruby-ASR, which refines the conventional target into a span-bound orthographic--lexical-reading sequence. Unlike separate full-sentence orthographic and phonological outputs, the ruby representation locally binds each written span to its realized reading and permits deterministic recovery of both views. We instantiate the target under subtitle-style and verbatim-style transcription conventions using a Qwen3-ASR backbone; a mora-level CTC objective provides auxiliary monotonic reading supervision. The experimental results across five Japanese benchmarks show that refining the recognition target can improve lexical-reading recovery without sacrificing readable orthographic transcription. We release the checkpoints and inference code.
- id: 2026_interspeech_shi
  title: Distilling LLM Semantic Priors into Encoder-Only Multi-Talker ASR with Talker-Count Routing
  authors: Hao Shi, Yusuke Fujita, Roman Koshkin, Mengjie Zhao, Yuan Gao, Lianbo Liu, Yui Sudo
  venue: INTERSPEECH
  venue_full: Proc. INTERSPEECH
  year: 2026
  type: conference
  themes:
  - attribution
  - grounded
  figure: /assets/figures/2026_interspeech_shi.webp
  links:
    arxiv: https://arxiv.org/abs/2603.10587
    bibtex: /files/bib/2026_interspeech_shi.txt
  details:
  - label: Motivation
    text: LLMs offer strong semantic priors for multi-talker ASR, but an autoregressive LLM decoder is computationally expensive and remains fragile under heavy overlap.
  - label: Method
    text: An encoder-only framework adapts an LLM to multi-talker conditioning and distills its semantic guidance into the encoder during training, keeping fast CTC-style decoding at inference. A post-encoder separator with serialized CTC produces talker-ordered transcripts, and a Talker-Count Head selects the decoding branch.
  - label: Results
    text: On LibriMix, the encoder-only model is comparable to LLM-based systems with two talkers and significantly better with three, at a much smaller real-time factor.
  abstract: Large language models (LLMs) provide strong semantic priors that can improve multi-talker automatic speech recognition (MT-ASR), but using an LLM as an autoregressive decoder is computationally expensive and remains fragile under heavy overlap. In this paper, we propose an encoder-only MT-ASR framework that adapts an LLM to multi-talker conditioning and distills its semantic guidance into the encoder during training, while retaining fast CTC-style decoding at inference. Our model employs a post-encoder separator with serialized CTC to produce talker-ordered transcripts, and leverages an adapted LLM-based SOT objective as a multi-talker-aware teacher signal to explicitly regularize mixed-speech representations. To further support variable numbers of talkers, we introduce a Talker-Count Head that predicts the talker count and dynamically selects the appropriate decoding branch. Experiments on LibriMix show that the proposed encoder-only model achieves comparable performance to LLM-based systems in the two-talker condition, while delivering significant improvements in the three-talker condition with significant small RTF.
- id: 2026_interspeech_mengjie
  title: Speech-Worthy Alignment for Japanese SpeechLLMs via Direct Preference Optimization
  authors: Mengjie Zhao, Lianbo Liu, Yusuke Fujita, Hao Shi, Yuan Gao, Roman Koshkin, Yui Sudo
  venue: INTERSPEECH
  venue_full: Proc. INTERSPEECH
  year: 2026
  type: conference
  themes:
  - grounded
  figure: /assets/figures/2026_interspeech_mengjie.webp
  links:
    arxiv: https://arxiv.org/abs/2603.12565
    bibtex: /files/bib/2026_interspeech_mengjie.txt
  details:
  - label: Motivation
    text: SpeechLLMs inherit written-style output from text LLM backbones, which suits text-to-speech poorly. The mismatch is pronounced in Japanese, where spoken and written registers differ substantially.
  - label: Method
    text: A preference-based alignment adapts Japanese SpeechLLMs toward concise, conversational, readily synthesized text, evaluated on SpokenElyza, a new benchmark derived from ELYZA-tasks-100 with auditory verification by native experts.
  - label: Results
    text: Substantial improvement on SpokenElyza while largely preserving performance on the original written-style evaluation.
  abstract: 'SpeechLLMs typically combine ASR-trained encoders with text-based LLM backbones, leading them to inherit written-style output patterns unsuitable for text-to-speech synthesis. This mismatch is particularly pronounced in Japanese, where spoken and written registers differ substantially in politeness markers, sentence-final particles, and syntactic complexity. We propose a preference-based alignment approach to adapt Japanese SpeechLLMs for speech-worthy outputs: text that is concise, conversational, and readily synthesized as natural speech. To rigorously evaluate this task, we introduce SpokenElyza, a benchmark for Japanese speech-worthiness derived from ELYZA-tasks-100 with auditory verification by native experts. Experiments show that our approach achieves substantial improvement on SpokenElyza while largely preserving performance on the original written-style evaluation. We will release SpokenElyza to support future research on Japanese spoken dialog systems.'
- id: 2026_interspeech_haoyang
  title: Training-Free Intelligibility-Guided Observation Addition for Noisy ASR
  authors: Haoyang Li, Changsong Liu, Wei Rao, Hao Shi, Sakriani Sakti, Eng Siong Chng
  venue: INTERSPEECH
  venue_full: Proc. INTERSPEECH
  year: 2026
  type: conference
  themes:
  - robust
  figure: /assets/figures/2026_interspeech_haoyang.webp
  links:
    arxiv: https://arxiv.org/abs/2602.20967
    bibtex: /files/bib/2026_interspeech_haoyang.txt
  abstract: Automatic speech recognition (ASR) degrades severely in noisy environments. Although speech enhancement (SE) front-ends effectively suppress background noise, they often introduce artifacts that harm recognition. Observation addition (OA) addressed this issue by fusing noisy and SE enhanced speech, improving recognition without modifying the parameters of the SE or ASR models. This paper proposes an intelligibility-guided OA method, where fusion weights are derived from intelligibility estimates obtained directly from the backend ASR. Unlike prior OA methods based on trained neural predictors, the proposed method is training-free, reducing complexity and enhances generalization. Extensive experiments across diverse SE-ASR combinations and datasets demonstrate strong robustness and improvements over existing OA baselines. Additional analyses of intelligibility-guided switching-based alternatives and frame versus utterance-level OA further validate the proposed design.
- id: report-2026-liu
  title: 'Sarashina2.2-TTS: Tackling Kanji Polyphony in Japanese Speech Generation via Data Scaling and Targeted Data Synthesis'
  authors: Lianbo Liu, Shiao Zhu, Kai Washizaki, Reo Yoneyama, Haesung Jeon, Mengjie Zhao, Yusuke Fujita, Hao Shi, Nao Yoshida, Yuan Gao, Roman Koshkin, Yukiya Hono, Yui Sudo
  venue: arXiv
  venue_full: arXiv preprint arXiv:2606.25369
  year: 2026
  type: preprint
  themes:
  - grounded
  figure: /assets/figures/report-2026-liu.webp
  links:
    arxiv: https://arxiv.org/abs/2606.25369
    code: https://github.com/sbintuitions/sarashina2.2-tts
    bibtex: /files/bib/report-2026-liu.txt
  details:
  - label: Motivation
    text: LLM-based TTS has focused mostly on English and Chinese; Japanese remains under-explored, with challenges such as widespread context-dependent kanji polyphony.
  - label: Method
    text: Training is scaled to about 361k hours of balanced Japanese and English speech, with targeted augmentation covering all 2,136 Joyo kanji. The Joyo Kanji Yomi Benchmark (4,378 readings) and the Kana-CER metric measure pronunciation correctness directly.
  - label: Results
    text: State-of-the-art kanji-level reading accuracy, sentence-level pronunciation matching top baselines, and the highest speaker similarity in zero-shot Japanese synthesis, with stable Japanese pronunciation regardless of prompt language.
  abstract: 'While large language model (LLM)-based text-to-speech (TTS) systems have achieved high-quality speech synthesis, most existing systems focus on English and Chinese. Japanese, however, remains under-explored, and its unique linguistic challenges, such as widespread context-dependent kanji polyphony, have yet to be adequately tackled. Here we introduce Sarashina2.2-TTS (https://github.com/sbintuitions/sarashina2.2-tts), a Japanese-centric LLM-TTS system that tackles these challenges through a dual approach: data strategy and evaluation methodology. First, we scale training to approximately 361k hours of speech, incorporating a balanced mix of Japanese and English data. Furthermore, we design a targeted data augmentation pipeline covering all 2,136 Joyo (regular-use) kanji designated by Japan''s Agency for Cultural Affairs to efficiently address kanji polyphony disambiguation. Second, we introduce the Joyo Kanji Yomi Benchmark (https://github.com/sbintuitions/JoyoKanji-Yomi-Benchmark), covering all 2,136 Joyo kanji and their 4,378 readings. Alongside this benchmark, we propose Kana-CER, a metric that compares synthesized speech against reference readings in the kana space, eliminating orthographic variations to directly measure pronunciation correctness. Experiments demonstrate that our targeted data augmentation significantly improves reading accuracy. Overall, Sarashina2.2-TTS achieves state-of-the-art kanji-level reading accuracy and matches top baselines on general sentence-level pronunciation, while delivering the highest speaker similarity in zero-shot Japanese speech synthesis. Furthermore, cross-lingual evaluation reveals that Sarashina2.2-TTS is the only system that maintains stable Japanese pronunciation regardless of the prompt language, confirming that our balanced training approach improves cross-lingual robustness.'
- id: trans2025_shi
  title: Combining Deterministic Enhanced Conditions With Dual-Streaming Encoding for Diffusion-Based Speech Enhancement
  authors: Hao Shi, Xugang Lu, Kazuki Shimada, Tatsuya Kawahara
  venue: IEEE TASLP
  venue_full: IEEE Transactions on Audio, Speech and Language Processing, vol. 33, pp. 4253–4266
  year: 2025
  type: journal
  themes:
  - robust
  selected: true
  summary: Introduces a diffusion-based speech enhancement framework with deterministic enhanced conditions and dual-stream encoding.
  figure: /assets/figures/trans2025_shi.webp
  links:
    arxiv: https://arxiv.org/abs/2505.13983
    doi: https://doi.org/10.1109/TASLPRO.2025.3619824
    code: https://github.com/hshi-speech/Repair-Diffusion
    bibtex: /files/bib/trans2025_shi.txt
  details:
  - label: Motivation
    text: Diffusion-based speech enhancement needs reliable conditions, but noisy features make poor ones. Features enhanced by deterministic models are an option, yet their distortion and information loss can affect the diffusion process.
  - label: Method
    text: The paper first compares deterministic-only and deterministic-noisy conditions, then proposes DERDM-SE, a dual-streaming encoding Repair-Diffusion model that uses both, with a deterministic model combining coarse- and fine-grained processing.
  - label: Results
    text: On CHiME-4, the proposed models leverage deterministic models effectively, achieving better enhancement scores and more stable performance than other diffusion-based SE models.
  abstract: 'Diffusion-based speech enhancement (SE) models need to incorporate correct prior knowledge as reliable conditions to generate accurate predictions. However, providing reliable conditions using noisy features is challenging. One solution is to use features enhanced by deterministic methods as conditions. However, the information distortion and loss caused by deterministic methods might affect the diffusion process. In this paper, we first investigate the effects of using different deterministic SE models as conditions for diffusion. We validate two conditions depending on whether the noisy feature was used as part of the condition: one using only the deterministic feature (deterministic-only), and the other using both deterministic and noisy features (deterministic-noisy). Preliminary investigation found that using deterministic enhanced conditions improves hearing experiences on real data, while the choice between using deterministic-only or deterministic-noisy conditions depends on the deterministic models. Based on these findings, we propose a dual-streaming encoding Repair-Diffusion Model for SE (DERDM-SE) to more effectively utilize both conditions. Moreover, we found that fine-grained deterministic models have greater potential in objective evaluation metrics, while UNet-based deterministic models provide more stable diffusion performance. Therefore, in the DERDM-SE, we propose a deterministic model that combines coarse- and fine-grained processing. Experimental results on CHiME4 show that the proposed models effectively leverage deterministic models to achieve better SE evaluation scores, along with more stable performance compared to other diffusion-based SE models.'
- id: apsipa-trans-gao-2025
  title: Multi-attribute Learning for Multi-level Emotion Recognition from Speech
  authors: Yuan Gao, Hao Shi, Chenhui Chu, Tatsuya Kawahara
  venue: APSIPA Trans.
  venue_full: APSIPA Transactions on Signal and Information Processing, vol. 14, no. e20, pp. 1–29
  year: 2025
  type: journal
  themes:
  - other
  figure: /assets/figures/apsipa-trans-gao-2025.webp
  links:
    pdf: /files/publications/apsipa-trans-gao-2025.pdf
    doi: https://doi.org/10.1561/116.20250025
    bibtex: /files/bib/apsipa-trans-gao-2025.txt
  abstract: 'In this paper, we propose a multi-level speech emotion recognition (SER) system that captures both acoustic and linguistic emotional features using only speech input. In particular, our approach utilizes an acoustic feature extractor (HuBERT) to process the input waveform, capturing acoustic emotional features while simultaneously performing automatic speech recognition (ASR) to implicitly learn linguistic information. The ASR-decoded transcriptions are then fed into a linguistic feature extractor (BERT) to explicitly encode linguistic emotional features. To combine these features, we introduce a temporal gated fusion method that dynamically modulates the contribution of each modality, addressing modality incongruity issues. Furthermore, integrating multi-attribute learning for emotion-related attributes such as gender and speaking style, further enhances SER performance. To address gradient conflicts inherent in multi-attribute learning, we propose a twostage fine-tuning framework employing adapters. Additionally, to mitigate the negative impact of ASR errors, we introduce an error correction module and a contrastive learning method to align representations learned from ground-truth text and the decoded transcriptions. Comprehensive experimental results on the IEMOCAP and MELD datasets validate that our method enhances SER ∗Corresponding author: gao.yuan.75x@st.kyoto-u.ac.jp. This work was supported by JST SPRING (JPMJSP2110), JST Moonshot R&D (JPMJPS2011). Received 08 May 2025; revised 10 June 2025; accepted 03 July 2025 ISSN 2048-7703; DOI 10.1561/116.20250025 © 2025 Y. Gao, H. Shi, C. Chu and T. Kawahara'
- id: asru-2025-shi
  title: Serialized Output Prompting for Large Language Model-based Multi-Talker Speech Recognition
  authors: Hao Shi, Yusuke Fujita, Tomoya Mizumoto, Lianbo Liu, Atsushi Kojima, Yui Sudo
  venue: IEEE ASRU
  venue_full: Proc. IEEE ASRU
  year: 2025
  type: conference
  themes:
  - attribution
  - grounded
  selected: true
  summary: Extracts serialized output prompts from mixed speech and uses them to guide an LLM for multi-talker ASR.
  figure: /assets/figures/asru-2025-shi.webp
  links:
    arxiv: https://arxiv.org/abs/2509.04488
    doi: https://doi.org/10.1109/ASRU65441.2025.11434801
    code: https://github.com/hshi-speech/Multi-talker-ASR-with-LLMs
    bibtex: /files/bib/asru-2025-shi.txt
  details:
  - label: Motivation
    text: Existing LLM-based multi-talker ASR systems omit prompts or rely on simple task-definition prompts; designing prompts to enhance performance had not been explored.
  - label: Method
    text: 'A separator and serialized CTC layers after the speech encoder extract multi-talker content in a first-speaking-first-out manner. Greedy decoding of the CTC outputs yields a serialized output prompt (SOP) for the LLM, trained in three stages: SOT fine-tuning, serialized speech information extraction, and SOP-based adaptation.'
  - label: Results
    text: On LibriMix, the LLM-based SOT model does well with two talkers but fails to fully leverage the LLM in harder conditions such as three talkers; SOP significantly improves performance in both two- and three-talker conditions.
  abstract: Prompts are crucial for task definition and for improving the performance of large language models (LLM)-based systems. However, existing LLM-based multi-talker (MT) automatic speech recognition (ASR) systems either omit prompts or rely on simple task-definition prompts, with no prior work exploring the design of prompts to enhance performance. In this paper, we propose extracting serialized output prompts (SOP) and explicitly guiding the LLM using structured prompts to improve system performance (SOP-MT-ASR). A Separator and serialized Connectionist Temporal Classification (CTC) layers are inserted after the speech encoder to separate and extract MT content from the mixed speech encoding in a first-speaking-first-out manner. Subsequently, the SOP, which serves as a prompt for LLMs, is obtained by decoding the serialized CTC outputs using greedy search. To train the model effectively, we design a three-stage training strategy, consisting of serialized output training (SOT) fine-tuning, serialized speech information extraction, and SOP-based adaptation. Experimental results on the LibriMix dataset show that, although the LLM-based SOT model performs well in the two-talker scenario, it fails to fully leverage LLMs under more complex conditions, such as the three-talker scenario. The proposed SOP approach significantly improved performance under both two- and three-talker conditions.
- id: asru_2025_mizumoto
  title: Evaluating Japanese Dialect Robustness Across Speech and Text-based Large Language Models
  authors: Tomoya Mizumoto, Yusuke Fujita, Hao Shi, Lianbo Liu, Atsushi Kojima, Yui Sudo
  venue: IEEE ASRU
  venue_full: Proc. IEEE ASRU
  year: 2025
  type: conference
  themes:
  - grounded
  figure: /assets/figures/asru_2025_mizumoto.webp
  links:
    arxiv: https://arxiv.org/abs/2606.25436
    doi: https://doi.org/10.1109/ASRU65441.2025.11434668
    bibtex: /files/bib/asru_2025_mizumoto.txt
  details:
  - label: Motivation
    text: Dialectal variation remains a major challenge for spoken dialogue systems, and it is unclear how the dialect understanding of a base LLM affects speech language models.
  - label: Method
    text: Robustness is defined as the ratio of performance on dialectal versus standard inputs, allowing fair comparison of LLMs and SLMs using Japanese dialects as a test case.
  - label: Results
    text: SLM robustness correlates with that of the text-based counterpart; training with dialectal data and fine-tuning the speech encoder each improve robustness.
  abstract: Dialogue systems based on large language models (LLMs) have advanced significantly in recent years. However, dialectal variation remains a major challenge, particularly for systems that process spoken input. LLM-based speech language models (SLMs), which integrate LLMs with speech processing components, show promise for spoken language tasks, yet their ability to comprehend dialects has not been sufficiently studied. Moreover, it remains unclear how the dialectal understanding of the base LLM affects SLM performance. This study investigates the dialectal robustness of both LLMs and SLMs using Japanese dialects as a test case. We define robustness as the ratio of performance on dialectal versus standard inputs, enabling fair comparisons. Our experiments show that SLM robustness correlates with that of their text-based counterparts. Furthermore, training with dialectal data and fine-tuning the speech encoder each improves robustness in SLMs.
- id: apsipa-2025-kojima
  title: Conversation Context-Aware Direct Preference Optimization for Style-Controlled Speech Synthesis
  authors: Atsushi Kojima, Yusuke Fujita, Hao Shi, Tomoya Mizumoto, Mengjie Zhao, Yui Sudo
  venue: APSIPA ASC
  venue_full: Proc. APSIPA ASC, pp. 573–578
  year: 2025
  type: conference
  themes:
  - grounded
  links:
    doi: https://doi.org/10.1109/APSIPAASC65261.2025.11249141
    bibtex: /files/bib/apsipa-2025-kojima.txt
  abstract: 'Conversational text-to-speech (TTS) generates context-appropriate expressive speech by modeling dialogue context, without requiring manual paralinguistic labels such as emotion or intent. However, acoustically similar emotions (e.g., happy vs. angry) often cause inappropriate renderings. To address this, we propose a preference-based optimization approach that reinforces the model toward selecting contextually appropriate emotional expressions. Specifically, we adopt direct preference optimization (DPO) in a unit-based TTS architecture, enabling fine-grained supervision of emotional expression by comparing discrete unit sequences for more and less suitable speech samples. Our method employs a text-to-unit model predicting discrete acoustic units from phonemes and context, followed by a unit-based HiFi-GAN vocoder. Training proceeds in two stages: first, the text-to-unit model is optimized with cross-entropy (CE) loss on ground-truth units; second, DPO is applied using unit pairs reflecting appropriate versus inappropriate emotions within the same context. Experiments on the STUDIES dataset show that preference-based optimization substantially improves emotion recognition accuracy (67.14 % with CE+DPO vs. 48.45 % with CE only). These results demonstrate that our approach enables fine-grained control of emotional expression and better captures subtle distinctions in conversational speech.'
- id: icassp-2025-cui
  title: Reducing the Gap Between Pretrained Speech Enhancement and Recognition Models Using a Real Speech-Trained Bridging Module
  authors: Zhongjian Cui, Chenrui Cui, Tianrui Wang, Mengnan He, Hao Shi, Meng Ge, Caixia Gong, Longbiao Wang, Jianwu Dang
  venue: IEEE ICASSP
  venue_full: Proc. IEEE ICASSP
  year: 2025
  type: conference
  themes:
  - robust
  figure: /assets/figures/icassp-2025-cui.webp
  links:
    arxiv: https://arxiv.org/abs/2501.02452
    doi: https://doi.org/10.1109/ICASSP49660.2025.10889737
    bibtex: /files/bib/icassp-2025-cui.txt
  abstract: "The information loss or distortion caused by single-channel speech enhancement (SE) harms the performance of automatic speech recognition (ASR). \nObservation addition (OA) is an effective post-processing method to improve ASR performance by balancing noisy and enhanced speech. \nDetermining the OA coefficient is crucial. \nHowever, the currently supervised OA coefficient module, called the bridging module, only utilizes simulated noisy speech for training, which has a severe mismatch with real noisy speech. \nIn this paper, we propose training strategies to train the bridging module with real noisy speech. \nFirst, DNSMOS is selected to evaluate the perceptual quality of real noisy speech with no need for the corresponding clean label to train the bridging module. \nAdditional constraints during training are introduced to enhance the robustness of the bridging module further. \nEach utterance is evaluated by the ASR back-end using various OA coefficients to obtain the word error rates (WERs). \nThe WERs are used to consist of a multidimensional vector. \nThis vector is introduced into the bridging module with multi-task learning and is used to determine the optimal OA coefficients. \nThe experimental results on the CHiME-4 dataset show that the proposed methods all had significant improvement compared with the simulated data trained bridging module, especially under real evaluation sets."
  legacy: Icassp2025cui
- id: icassp-2025-zhao
  title: Adapting Whisper for Code-Switching through Encoding Refining and Language-Aware Decoding
  authors: Jiahui Zhao, Hao Shi, Chenrui Cui, Tianrui Wang, Hexin Liu, Zhaoheng Ni, Lingxuan Ye, Longbiao Wang
  venue: IEEE ICASSP
  venue_full: Proc. IEEE ICASSP
  year: 2025
  type: conference
  themes:
  - other
  figure: /assets/figures/icassp-2025-zhao.webp
  links:
    arxiv: https://arxiv.org/abs/2412.16507
    doi: https://doi.org/10.1109/ICASSP49660.2025.10889634
    bibtex: /files/bib/icassp-2025-zhao.txt
  abstract: "Code-switching (CS) automatic speech recognition (ASR) faces challenges due to the language confusion resulting from accents, auditory similarity, and seamless language switches. \nAdaptation on the pre-trained multi-lingual model has shown promising performance for CS-ASR. \nIn this paper, we adapt Whisper, which is a large-scale multilingual pre-trained speech recognition model, to CS from both encoder and decoder parts. \nFirst, we propose an encoder refiner to enhance the encoder's capacity of intra-sentence swithching. \nSecond, we propose using two sets of language-aware adapters with different language prompt embeddings to achieve language-specific decoding information in each decoder layer. \nThen, a fusion module is added to fuse the language-aware decoding. \nThe experimental results using the SEAME dataset show that, compared with the baseline model, the proposed approach achieves a relative MER reduction of 4.1% and 7.2% on the dev_man and dev_sge test sets, respectively, surpassing state-of-the-art methods. \nThrough experiments, we found that the proposed method significantly improves the performance on non-native language in CS speech, indicating that our approach enables Whisper to better distinguish between the two languages."
  legacy: Icassp2025zhao
- id: taslp-2024-shi
  title: Waveform-Domain Speech Enhancement Using Spectrogram Encoding for Robust Speech Recognition
  authors: Hao Shi, Masato Mimura, Tatsuya Kawahara
  venue: IEEE/ACM TASLP
  venue_full: IEEE/ACM Transactions on Audio, Speech, and Language Processing, vol. 32, pp. 3049–3060
  year: 2024
  type: journal
  themes:
  - robust
  selected: true
  summary: Presents a waveform-domain speech enhancement method with spectrogram encoding for robust speech recognition.
  figure: /assets/figures/taslp-2024-shi.webp
  links:
    pdf: /files/publications/taslp-2024-shi.pdf
    doi: https://doi.org/10.1109/TASLP.2024.3407511
    bibtex: /files/bib/taslp-2024-shi.txt
  details:
  - label: Motivation
    text: Waveform-domain speech enhancement reaches state-of-the-art results on many datasets, while spectrogram-based enhancement tends to behave more robustly and stably.
  - label: Method
    text: WaveSpecEnc, a waveform-spectrogram hybrid, refines the temporal feature map with spectrogram encoding in each encoder layer. WaveSpecEnc+ further passes spectrogram encoding information to both the enhancement front-end and the ASR back-end.
  - label: Results
    text: On CHiME-4, ASR performance on real evaluation sets improves consistently and outperforms methods including DEMUCS and Conv-TasNet. Refining in shallow encoder layers is very effective, and the effect holds even with a strong WavLM-based ASR baseline.
  abstract: While waveform-domain speech enhancement (SE) has been extensively investigated in recent years and achieves state-of-the-art performance in many datasets, spectrogram-based SE tends to show robust and stable enhancement behavior. In this paper, we propose a waveform-spectrogram hybrid method (WaveSpecEnc) to improve the robustness of waveform-domain SE. WaveSpecEnc refines the corresponding temporal feature map by spectrogram encoding in each encoder layer. Incorporating spectral information provides robust human hearing experience performance. However, it has a minor automatic speech recognition (ASR) improvement. Thus, we improve it for robust ASR by further utilizing spectrogram encoding information (WaveSpecEnc+) to both the SE front-end and ASR back-end. Experimental results using the CHiME-4 dataset show that ASR performance in real evaluation sets is consistently improved with the proposed method, which outperformed others, including DEMUCS and Conv-Tasnet. Refining in the shallow encoder layers is very effective, and the effect is confirmed even with a strong ASR baseline using WavLM.
  legacy: Taslp2024shi
- id: slt-2024-shi
  title: Serialized Speech Information Guidance with Overlapped Encoding Separation for Multi-Speaker Automatic Speech Recognition
  authors: Hao Shi, Yuan Gao, Zhaoheng Ni, Tatsuya Kawahara
  venue: IEEE SLT
  venue_full: Proc. IEEE SLT, pp. 193–199
  year: 2024
  type: conference
  themes:
  - attribution
  figure: /assets/figures/slt-2024-shi.webp
  links:
    arxiv: https://arxiv.org/abs/2409.00815
    doi: https://doi.org/10.1109/SLT61566.2024.10832330
    code: https://github.com/hshi-speech/Multi-talker-ASR-with-LLMs
    bibtex: /files/bib/slt-2024-shi.txt
  details:
  - label: Motivation
    text: Serialized output training is convenient and flexible for multi-speaker ASR, but it is hard to train with attention loss alone.
  - label: Method
    text: EncSep inserts a separator after the encoder to extract multi-speaker information with CTC losses, exploiting the CTC-Attention hybrid loss. GEncSep concatenates the separated streams to give single-speaker guidance to attention during decoding.
  - label: Results
    text: On noisy Libri2Mix and Libri3Mix evaluation sets, EncSep gives relative improvements of more than 8% and 6%; GEncSep reaches more than 12% and 9%.
  abstract: Serialized output training (SOT) attracts increasing attention due to its convenience and flexibility for multi-speaker automatic speech recognition (ASR). However, it is not easy to train with attention loss only. In this paper, we propose the overlapped encoding separation (EncSep) to fully utilize the benefits of the connectionist temporal classification (CTC) and attention (CTC-Attention) hybrid loss. This additional separator is inserted after the encoder to extract the multi-speaker information with CTC losses. Furthermore, we propose the serialized speech information guidance SOT (GEncSep) to further utilize the separated encodings. The separated streams are concatenated to provide single-speaker information to guide attention during decoding. The experimental results on Libri2Mix and Libri3Mix show that the single-speaker encoding can be separated from the overlapped encoding. The CTC loss helps to improve the encoder representation under complex scenarios (three-speaker and noisy conditions), which makes the EncSep have a relative improvement of more than 8% and 6% on the noisy Libri2Mix and Libri3Mix evaluation sets, respectively. GEncSep further improved performance, which was more than 12% and 9% relative improvement for the noisy Libri2Mix and Libri3Mix evaluation sets.
  legacy: Slt2024shi
- id: interspeech-2024-shi
  title: Dual-path Adaptation of Pretrained Feature Extraction Module for Robust Automatic Speech Recognition
  authors: Hao Shi, Tatsuya Kawahara
  venue: INTERSPEECH
  venue_full: Proc. INTERSPEECH, pp. 2850–2854
  year: 2024
  type: conference
  themes:
  - robust
  figure: /assets/figures/interspeech-2024-shi.webp
  links:
    pdf: /files/publications/interspeech-2024-shi.pdf
    doi: https://doi.org/10.21437/Interspeech.2024-270
    bibtex: /files/bib/interspeech-2024-shi.txt
  details:
  - label: Motivation
    text: The feature extraction (FE) module of SSL models is usually frozen for ASR finetuning, but a severe mismatch between simulated and real noisy data calls for finetuning it without losing what was pretrained.
  - label: Method
    text: Dual-path adaptation combines the frozen pretrained FE path with a finetuned, adapted FE path through convolutional fusion layers, with adapters inserted into the Transformer encoder.
  - label: Results
    text: On CHiME-4, the method exploits the complementarity between the two FE paths, achieving significant improvements even with noise-robust WavLM models.
  abstract: Self-supervised learning (SSL)-based pretrained models have significantly improved automatic speech recognition (ASR) performance. As the feature extraction (FE) module has also been well-trained with a large amount of training data, freezing the FE during finetuning for downstream ASR tasks is common. When there is a severe mismatch between the simulated noisy data for pretraining and real noisy data, however, finetuning the FE with the real noisy data should be done without losing the effective information of the pretrained FE. In this paper, we propose a dual-path adaptation of the FE to address this problem. It combines the frozen pretrained FE path and the finetuned-adapted FE path with convolutional fusion layers. Moreover, adapters are inserted into the Transformer encoder. The experimental results using the CHiME–4 dataset show that using adapters for the FE or the Transformer encoder is effective, but achieving synergy of these two is challenging. Finetuning of the FE combined with adapters in the encoder realizes effective model adaptation. Moreover, the proposed method utilizes the complementarity between the pretrained and the finetuned FE paths, achieving significant improvements even with noise-robust WavLM models.
  legacy: Interspeech2024shi
- id: icassp-2024-shi
  title: Diffusion-Based Speech Enhancement with Joint Generative and Predictive Decoders
  authors: Hao Shi, Kazuki Shimada, Masato Hirano, Takashi Shibuya, Yuichiro Koyama, Zhi Zhong, Shusuke Takahashi, Tatsuya Kawahara, Yuki Mitsufuji
  venue: IEEE ICASSP
  venue_full: Proc. IEEE ICASSP, pp. 12951–12955
  year: 2024
  type: conference
  themes:
  - robust
  figure: /assets/figures/icassp-2024-shi.webp
  links:
    pdf: /files/publications/icassp-2024-shi.pdf
    arxiv: https://arxiv.org/abs/2305.10734
    doi: https://doi.org/10.1109/ICASSP48485.2024.10448429
    bibtex: /files/bib/icassp-2024-shi.txt
  details:
  - label: Motivation
    text: Reverse diffusion is time-consuming, and pipelines that initialize it with predictive enhancement do not make combined use of generative and predictive decoders.
  - label: Method
    text: 'A unified system uses both decoders at two levels: a shared encoder holds generative and predictive information, and decoded features are fused at the initial diffusion step to improve convergence and at the final step to combine complementary outputs.'
  - label: Results
    text: On Voice-Bank, incorporating predictive information gives faster decoding and higher PESQ than the score-based diffusion systems StoRM and SGMSE+.
  abstract: 'Diffusion-based generative speech enhancement (SE) has recently received attention, but reverse diffusion remains time-consuming. One solution is to initialize the reverse diffusion process with enhanced features estimated by a predictive SE system. However, the pipeline structure currently does not consider for a combined use of generative and predictive decoders. The predictive decoder allows us to use the further complementarity between predictive and diffusion-based generative SE. In this paper, we propose a unified system that use jointly generative and predictive decoders across two levels. The encoder encodes both generative and predictive information at the shared encoding level. At the decoded feature level, we fuse the two decoded features by generative and predictive decoders. Specifically, the two SE modules are fused in the initial and final diffusion steps: the initial fusion initializes the diffusion process with the predictive SE to improve convergence, and the final fusion combines the two complementary SE outputs to enhance SE performance. Experiments conducted on the Voice-Bank dataset demonstrate that incorporating predictive information leads to faster decoding and higher PESQ scores compared with other score-based diffusion SE (StoRM and SGMSE+).'
  legacy: Icassp2024shi
- id: hscma-2024-shi
  title: Ensemble Inference for Diffusion Model-Based Speech Enhancement
  authors: Hao Shi, Naoyuki Kamo, Marc Delcroix, Tomohiro Nakatani, Shoko Araki
  venue: IEEE ICASSPW
  venue_full: Proc. IEEE ICASSPW, pp. 735–739
  year: 2024
  type: conference
  themes:
