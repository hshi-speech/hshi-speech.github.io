- id: interspeech-2022-xu
  title: Self-Distillation Based on High-level Information Supervision for Compressing End-to-End ASR Model
  authors: Qiang Xu, Tongtong Song, Longbiao Wang, Hao Shi, Yuqin Lin, Yongjie Lv, Meng Ge, Qiang Yu, Jianwu Dang
  venue: INTERSPEECH
  venue_full: Proc. INTERSPEECH, pp. 1716–1720
