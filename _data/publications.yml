- id: arxiv_song
  title: Monolingual Recognizers Fusion for Code-switching Speech Recognition
  authors: Tongtong Song, Qiang Xu, Haoyu Lu, Longbiao Wang, Hao Shi, Yuqin Lin, Yanbing Yang, Jianwu Dang
  venue: arXiv
