  figure: /assets/figures/hscma-2024-shi.webp
  links:
    pdf: /files/publications/hscma-2024-shi.pdf
    doi: https://doi.org/10.1109/ICASSPW62465.2024.10627051
    bibtex: /files/bib/hscma-2024-shi.txt
  abstract: 'Diffusion-based speech enhancement (SE) is a probabilistic model that provides distribution of enhanced speech. Based on this property, we previously proposed ensemble inference and showed that solving a reverse Stochastic Differential Equation (SDE) multiple times and performing an ensemble over the obtained samples significantly improves the performance. Unfortunately, we failed to sufficiently explore our proposed ensemble inference. First, we only tested it on target speech extraction (TSE) and not on such general SE tasks as denoising. Second, sample generation greatly increased the computational complexity. Finally, the method considered all samples equally without heeding potential outliers. This paper addresses these issues and proposes a computationally efficient sample generation technique called SplitTree and ensemble inference combined with outlier removal to improve the ensemble’s effectiveness. We conducted experiments using the WSJ-CHiME3 and LibriMix-2spk datasets for denoising and TSE tasks and confirmed the following: 1) Ensemble inference also helps denoising tasks; 2) SplitTree reduces the complexity of the ensemble inference by about 40% while maintaining a similar level of performance; and 3) Our proposed outlier removal improves the ensemble performance for TSE task.'
  legacy: Icasspw2024shi
- id: report-2023-shi
  title: Exploration of Adapter for Noise Robust Automatic Speech Recognition
  authors: Hao Shi, Tatsuya Kawahara
  venue: arXiv
  venue_full: arXiv preprint arXiv:2402.18275
  year: 2024
  type: preprint
  themes:
  - robust
  figure: /assets/figures/report-2023-shi.webp
  links:
    arxiv: https://arxiv.org/abs/2402.18275
    bibtex: /files/bib/report-2023-shi.txt
  abstract: Adapting an automatic speech recognition (ASR) system to unseen noise environments is crucial. Integrating adapters into neural networks has emerged as a potent technique for transfer learning. This study thoroughly investigates adapter-based ASR adaptation in noisy environments. We conducted experiments using the CHiME--4 dataset. The results show that inserting the adapter in the shallow layer yields superior effectiveness, and there is no significant difference between adapting solely within the shallow layer and adapting across all layers. The simulated data helps the system to improve its performance under real noise conditions. Nonetheless, when the amount of data is the same, the real data is more effective than the simulated data. Multi-condition training is still useful for adapter training. Furthermore, integrating adapters into speech enhancement-based ASR systems yields substantial improvements.
  legacy: Report2023shi
- id: interspeech-2024-gao
  title: Speech Emotion Recognition with Multi-level Acoustic and Semantic Information Extraction and Interaction
  authors: Yuan Gao, Hao Shi, Chenhui Chu, Tatsuya Kawahara
  venue: INTERSPEECH
  venue_full: Proc. INTERSPEECH, pp. 1060–1064
  year: 2024
  type: conference
  themes:
