    doi: https://doi.org/10.21437/Interspeech.2024-2385
    bibtex: /files/bib/interspeech-2024-gao.txt
  abstract: Speech emotion recognition (SER) systems can learn linguistic information by integrating automatic speech recognition (ASR). However, existing SER systems fall short in explicitly learning semantic emotional information from ASR predictions. Our proposed system addresses this problem by incorporating a semantic feature extractor for explicit emotional information extraction. Furthermore, a cross attention-based information interaction module is proposed to learn the complementary emotional information in the embeddings from both feature extractors. Within the interaction module, a temporal-aware gate fusion network is incorporated to dynamically integrate the embeddings from acoustic and semantic feature extractors and mitigate the impact of ASR errors in SER. Experimental results on IEMOCAP show that our system outperforms the existing SER systems by improving the unweighted accuracy by 3.32%.
  legacy: Interspeech2024gao
- id: interspeech-2024-shu
  title: Error Correction by Paying Attention to Both Acoustic and Confidence References for Automatic Speech Recognition
  authors: Yuchun Shu, Bo Hu, Yifeng He, Hao Shi, Longbiao Wang, Jianwu Dang
  venue: INTERSPEECH
  venue_full: Proc. INTERSPEECH, pp. 3500–3504
  year: 2024
  type: conference
  themes:
  - other
  figure: /assets/figures/interspeech-2024-shu.webp
  links:
    pdf: /files/publications/interspeech-2024-shu.pdf
    arxiv: https://arxiv.org/abs/2407.12817
    doi: https://doi.org/10.21437/Interspeech.2024-1605
    bibtex: /files/bib/interspeech-2024-shu.txt
  abstract: Accurately finding the wrong words in the automatic speech recognition (ASR) hypothesis and recovering them well-founded is the goal of speech error correction. In this paper, we propose a non-autoregressive speech error correction method. A Confidence Module measures the uncertainty of each word of the N-best ASR hypotheses as the reference to find the wrong word position. Besides, the acoustic feature from the ASR encoder is also used to provide the correct pronunciation references. N-best candidates from ASR are aligned using the edit path, to confirm each other and recover some missing character errors. Furthermore, the cross-attention mechanism fuses the information between error correction references and the ASR hypothesis. The experimental results show that both the acoustic and confidence references help with error correction. The proposed system reduces the error rate by 21% compared with the ASR model.
  legacy: Interspeech2024shu
- id: icassp-2024-gao
  title: Enhancing Two-Stage Finetuning for Speech Emotion Recognition Using Adapters
  authors: Yuan Gao, Hao Shi, Chenhui Chu, Tatsuya Kawahara
  venue: IEEE ICASSP
  venue_full: Proc. IEEE ICASSP, pp. 11316–11320
  year: 2024
  type: conference
  themes:
  - other
  figure: /assets/figures/icassp-2024-gao.webp
  links:
    pdf: /files/publications/icassp-2024-gao.pdf
    doi: https://doi.org/10.1109/ICASSP48485.2024.10446645
    bibtex: /files/bib/icassp-2024-gao.txt
  abstract: This study investigates the effective finetuning of a pretrained model using adapters for speech emotion recognition (SER). Since emotion is related with linguistic and prosodic information and also other attributes such as gender and speaking style, a framework of multi-task learning (MTL) has been shown to be effective for SER. However, the learning targets of automatic speech recognition (ASR) and other attribute recognition are apparently in conflict. Therefore, we propose to employ different adaptation methods for different tasks in multiple finetuning stages. Since ASR is the most challenging and also influential for SER, in the first stage, we finetune all parameters of the pretrained model for ASR and SER. In the second stage, we incorporate adapters to finetune the model for gender and style recognition in addition to SER by freezing the parameters of the main Transformer model tuned for ASR. Experimental evaluations which extensively compare different adaptation methods using the IEMOCAP dataset demonstrate that the proposed approach achieves a significant improvement from the simple MTL.
  legacy: Icassp2024gao
- id: icassp-2023-shi-tf
  title: Time-Domain Speech Enhancement Assisted by Multi-Resolution Frequency Encoder and Decoder
  authors: Hao Shi, Masato Mimura, Longbiao Wang, Jianwu Dang, Tatsuya Kawahara
  venue: IEEE ICASSP
  venue_full: Proc. IEEE ICASSP, pp. 1–5
  year: 2023
  type: conference
  themes:
  - robust
  figure: /assets/figures/icassp-2023-shi-tf.webp
  links:
    pdf: /files/publications/icassp-2023-shi-tf.pdf
    arxiv: https://arxiv.org/abs/2303.14593
    doi: https://doi.org/10.1109/ICASSP49357.2023.10094718
    bibtex: /files/bib/icassp-2023-shi-tf.txt
  abstract: Time-domain speech enhancement (SE) has recently been intensively investigated. Among recent works, DEMUCS introduces multi-resolution STFT loss to enhance performance. However, some resolutions used for STFT contain non-stationary signals, and it is challenging to learn multi-resolution frequency losses simultaneously with only one output. For better use of multi-resolution frequency information, we supplement multiple spectrograms in different frame lengths into the time-domain encoders. They extract stationary frequency information in both narrowband and wideband. We also adopt multiple decoder outputs, each of which computes its corresponding resolution frequency loss. Experimental results show that (1) it is more effective to fuse stationary frequency features than non-stationary features in the encoder, and (2) the multiple outputs consistent with the frequency loss improve performance. Experiments on the Voice-Bank dataset show that the proposed method obtained a 0.14 PESQ improvement.
  legacy: Icassp2023shi
- id: waspaa-2023-zhong
  title: Extending Audio Masked Autoencoders toward Audio Restoration
  authors: Zhi Zhong, Hao Shi, Masato Hirano, Kazuki Shimada, Kazuya Tateishi, Takashi Shibuya, Shusuke Takahashi, Yuki Mitsufuji
  venue: WASPAA
  venue_full: Proc. IEEE WASPAA, pp. 1–5
  year: 2023
  type: conference
  themes:
  - robust
  figure: /assets/figures/waspaa-2023-zhong.webp
  links:
    arxiv: https://arxiv.org/abs/2305.06701
    doi: https://doi.org/10.1109/WASPAA58266.2023.10248171
    bibtex: /files/bib/waspaa-2023-zhong.txt
  abstract: Audio classification and restoration are among major downstream tasks in audio signal processing. However, restoration derives less of a benefit from pretrained models compared to the overwhelming success of pretrained models in classification tasks. Due to such unbalanced benefits, there has been rising interest in how to improve the performance of pretrained models for restoration tasks, e.g., speech enhancement (SE). Previous works have shown that the features extracted by pretrained audio encoders are effective for SE tasks, but these speech-specialized encoder-only models usually require extra decoders to become compatible with SE, and involve complicated pretraining procedures or complex data augmentation. Therefore, in pursuit of a universal audio model, the audio masked autoencoder (MAE) whose backbone is the autoencoder of Vision Transformers (ViT-AE), is extended from audio classification to SE, a representative restoration task with well-established evaluation standards. ViT-AE learns to restore masked audio signal via a mel-to-mel mapping during pretraining, which is similar to restoration tasks like SE. We propose variations of ViT-AE for a better SE performance, where the mel-to-mel variations yield high scores in non-intrusive metrics and the STFT-oriented variation is effective at intrusive metrics such as PESQ. Different variations can be used in accordance with the scenarios. Comprehensive evaluations reveal that MAE pretraining is beneficial to SE tasks and help the ViT-AE to better generalize to out-of-domain distortions. We further found that large-scale noisy data of general audio sources, rather than clean speech, is sufficiently effective for pretraining.
  legacy: WASPAA2023zhong
- id: interspeech-2022-shi
  title: Monaural Speech Enhancement Based on Spectrogram Decomposition for Convolutional Neural Network-sensitive Feature Extraction
  authors: Hao Shi, Longbiao Wang, Sheng Li, Jianwu Dang, Tatsuya Kawahara
  venue: INTERSPEECH
  venue_full: Proc. INTERSPEECH, pp. 221–225
  year: 2022
  type: conference
  themes:
  - robust
  figure: /assets/figures/interspeech-2022-shi.webp
  links:
    pdf: /files/publications/interspeech-2022-shi.pdf
    doi: https://doi.org/10.21437/Interspeech.2022-11268
    bibtex: /files/bib/interspeech-2022-shi.txt
  abstract: Many state-of-the-art speech enhancement (SE) systems have recently used convolutional neural networks (CNNs) to extract multi-scale feature maps. However, CNN relies more on local texture than global shape, which is more susceptible to degraded spectrogram and may fail to capture the detailed structure of speech. Although some two-stage systems feed the first-stage enhanced and original noisy spectrograms to the second stage simultaneously, this does not guarantee sufficient guidance for the second stage since the first-stage spectrogram can not provide precise spectral details. In order to allow CNNs to perceive clear speech component boundary information, we compose feature maps with spectrograms containing evident speech components according to the mask value from the first stage. The positions corresponding to the mask greater than certain thresholds are extracted as feature maps. These feature maps make the boundary information of speech components obvious by ignoring others, thus making CNNs sensitive to input features. Experiments on the VB dataset show that with a proper decomposition numbers, the proposed method can enhance SE performance, which can provide 0.15 PESQ improvement. Besides, the proposed method is more effective for spectral detail recovery.
  legacy: Interspeech2022shi
- id: apsipa-2022-shi-subband
  title: Subband-Based Spectrogram Fusion for Speech Enhancement by Combining Mapping and Masking Approaches
  authors: Hao Shi, Longbiao Wang, Sheng Li, Jianwu Dang, Tatsuya Kawahara
  venue: APSIPA ASC
  venue_full: Proc. APSIPA ASC, pp. 286–292
  year: 2022
  type: conference
  themes:
  - robust
  figure: /assets/figures/apsipa-2022-shi-subband.webp
  links:
    pdf: /files/publications/apsipa-2022-shi-subband.pdf
    doi: https://doi.org/10.23919/APSIPAASC55919.2022.9979930
    bibtex: /files/bib/apsipa-2022-shi-subband.txt
  abstract: Deep learning brings effective optimization and significant improvements to speech enhancement (SE). Mapping and masking are currently major approaches in single-channel frequency-domain SE with supervised learning. In this work, we first show that these two approaches are complementary in that mapping is more effective in low-frequency bands, while masking is more suitable in high-frequency bands. This is because the high-frequency bands typically have low energy, so estimating the enhanced spectrogram directly does not make sense. Moreover, learning on the low-energy parts is often annihilated by learning on the high-energy parts during the entire loss calculation. To exploit this complementarity, we propose subband-based spectrogram fusion (SBSF), which combines the spectrogram of low-frequency and high-frequency estimated by different SE models. Experimental evaluations show that the SBSF significantly improved the SE performance.
  legacy: Apsipa2022shi-subband
- id: apsipa-2022-shi-resolutions
  title: Fusing Multiple Bandwidth Spectrograms for Improving Speech Enhancement
  authors: Hao Shi, Yuchun Shu, Longbiao Wang, Jianwu Dang, Tatsuya Kawahara
  venue: APSIPA ASC
  venue_full: Proc. APSIPA ASC, pp. 1935–1940
  year: 2022
  type: conference
  themes:
  - robust
  figure: /assets/figures/apsipa-2022-shi-resolutions.webp
  links:
    pdf: /files/publications/apsipa-2022-shi-resolutions.pdf
    doi: https://doi.org/10.23919/APSIPAASC55919.2022.9980180
    bibtex: /files/bib/apsipa-2022-shi-resolutions.txt
  abstract: 'The spectrogram is a common feature of frequency domain speech enhancement (SE). It can be divided into wideband and narrowband according to the resolution of the spectrogram, which is controlled by the length of framing time. Although narrowband and wideband spectrograms have their own spectral characteristics, SE systems conventionally utilize single narrow bandwidth spectrograms. In this paper, we propose an SE system that simultaneously utilizes multiple bandwidth spectral information, more specifically, augments the wider bandwidth (16ms and 8ms) spectrograms as auxiliary information. Multiple bandwidth information fusion is implemented in the encoder in two ways: fusion only in the last layer (MI-F) and fusion layer by layer (MI-L). Experiments using the VB dataset show that different bandwidth spectrograms can provide supplementary information, which provides more than 0.1 PESQ improvement. The embedding dimension affects the position of the fusion position: MI-F requires less embedding dimension, while MI-L requires a larger dimension and more varied bandwidth. Moreover, the spectrogram which differs more from the main enhancement spectrogram provides better auxiliary information.'
  legacy: Apsipa2022shi-resolution
- id: iscslp-2022-yang
  title: Adaptive Attention Network with Domain Adversarial Training for Multi-Accent Speech Recognition
  authors: Yanbing Yang, Hao Shi, Yuqin Lin, Meng Ge, Longbiao Wang, Qingzhi Hou, Jianwu Dang
  venue: ISCSLP
  venue_full: Proc. ISCSLP, pp. 6–10
  year: 2022
  type: conference
  themes:
  - other
  figure: /assets/figures/iscslp-2022-yang.webp
  links:
    pdf: /files/publications/iscslp-2022-yang.pdf
    doi: https://doi.org/10.1109/ISCSLP57327.2022.10038197
    bibtex: /files/bib/iscslp-2022-yang.txt
  abstract: Spoken accents severely degrade the performance of automatic speech recognition (ASR) systems. Domain adversarial training (DAT) is widely adopted for generating domain-invariant features to reduce the influence of accents. However, the generated features trained by DAT are still maintaining some accent discrimination information, limiting the ASR performance. In addition, the features generated by DAT of each accent have different degrees of residual accent discriminant information. In this paper, we propose an adaptive attention network with DAT to further eliminate the influence of retaining accent information in features generated by DAT. We employ the adaptive attention module to transform the encoder output to a more general representation. Experiments on the AESRC2020 dataset show that the proposed method can achieve satisfactory performance improvements on seen and unseen accent when the correct accent information is still preserved in the output of the encoder.
  legacy: Iscslp2022yang
