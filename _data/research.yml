# Research content and the shared taxonomy. /research/ shows the overview; /research/<id>/ each direction.
# Taxonomy: `name` and `subtitle` are the full direction, used in headings and page titles.
# `short` is the label for navigation and topic filters only. `id` is a stable key for URLs and for
# `themes` in publications.yml.
# The Publications page stays the single source for paper metadata: papers are referenced by id only.
#
# Writing rules:
# - evolution (or strands): what each study did, what limitation it addressed, what it showed. Each
#   paper's result appears here once. Do not imply that one paper builds on another unless a paper
#   says so; mark approaches that run alongside the others with `relation`.
#   `evolution_title` renames the section. Use `strands` when the work is not chronological.
# - insights: two or three points that emerge across papers, worded as readings, not as paper summaries.
# - open_questions: unresolved problems, as questions. Not results, and not claims about unpublished work.
# - highlights: two or three demonstrated results for the overview. `representative: true` also shows
#   one on the home page, so choose them by the strength of the work, not one per direction by default.
#   `project` adds a project link there.
# - papers: the short representative list (two to four papers).
intro: "I work on a recurring problem in speech systems: the information a model needs is in the signal, but it can be lost or overridden on the way to the output. Noise and reverberation corrupt it, overlapping talkers entangle it, and learned priors can replace it with something plausible."
goal: "A common goal runs through this work: maintaining reliable correspondence between acoustic observations and model outputs as speech scenes and model priors become increasingly complex."
connection:
  - "Enhancement work showed that a cleaner signal is not automatically a better input: front-ends add distortion that can harm recognition. Most of that work treats the interference as noise. When the interference is other speech, the question becomes which evidence belongs to which talker."
  - "Multi-talker work raised a further issue. LLM decoders bring strong linguistic priors, yet recognition degrades as talkers are added, and richer acoustic prompts alone did not solve this. How a model stays connected to the evidence while it generates belongs to the third direction, which also covers cases where the written form itself hides what was said, as with Japanese readings."
  - "These limitations link the directions, but the work was not strictly sequential: enhancement papers continue through 2026, and the Japanese speech work runs alongside the multi-talker work."
themes:
  - id: robust
    number: "01"
    name: "Reliable Perception"
    short: "Robust Speech"
    subtitle: "Robust Speech Processing"
    tagline: "Recover reliable speech evidence from noisy, reverberant, and otherwise degraded observations."
    challenge: "How can reliable acoustic evidence be recovered from noisy, reverberant, and degraded speech?"
    keywords: [Speech Enhancement, Noise-Robust ASR, Dereverberation]
    overview: "Enhancement can make a recording sound cleaner and still harm recognition, through the artifacts it adds and the information it removes, and models trained on simulated noise face a mismatch with real recordings. This direction studies how to recover usable speech for both listeners and ASR."
    highlights:
      - text: "Passing spectrogram encoding to both the enhancement front-end and the ASR back-end consistently improved recognition on the real CHiME-4 evaluation sets, outperforming methods including DEMUCS and Conv-TasNet."
        papers: [taslp-2024-shi]
        representative: true
      - text: "Conditioning diffusion on deterministic and noisy features through dual-streaming encoding gave better enhancement scores and more stable performance than other diffusion-based models on CHiME-4."
        papers: [trans2025_shi]
      - text: "Mapping was more effective in low-frequency bands and masking in high-frequency bands, and fusing the two significantly improved enhancement."
        papers: [apsipa-2022-shi-subband]
    questions:
      - "Where are mapping and masking, waveform and spectrogram, and predictive and generative models complementary, and how should they be combined?"
      - "Why does better-sounding enhancement not always improve recognition, and how should a front-end be designed for ASR?"
      - "How can a pretrained model adapt to real noise without losing what it learned in pretraining?"
      - "What can a diffusion-based enhancement model use as a reliable condition when the noisy input is itself unreliable?"
    evolution:
      - when: "2020–2022"
        title: "Fusing complementary estimates"
        text: "Spectrogram fusion combined complementary systems, first for dereverberation with minimum difference masks, then as a jointly trained front-end for end-to-end ASR. Subband fusion located the complementarity: mapping suited low-frequency bands and masking suited high-frequency bands."
        papers: [icassp-2020-shi, apsipa-2021-shi, apsipa-2022-shi-subband]
      - when: "2022–2024"
        title: "Spectral information in enhancement models"
        text: "Multiple-bandwidth spectrograms supplied complementary information, and multi-resolution spectrograms were added to time-domain encoders. WaveSpecEnc refined each waveform encoder layer with spectrogram encoding, which helped perceived quality but gave only a minor ASR improvement. WaveSpecEnc+ therefore also passed this information to the ASR back-end, and the gains on real CHiME-4 data held even with a strong WavLM baseline."
        papers: [apsipa-2022-shi-resolutions, icassp-2023-shi-tf, taslp-2024-shi]
      - when: "2024"
        title: "Adapting pretrained models to real noise"
        text: "An adapter study on CHiME-4 found that shallow layers were the most effective place to adapt, and that real data was more effective than the same amount of simulated data. Dual-path adaptation addressed the feature extraction module, which is usually frozen, by keeping a frozen pretrained path beside a finetuned one, with significant improvements even for noise-robust WavLM models."
        papers: [report-2023-shi, interspeech-2024-shi]
      - when: "2024–2025"
        title: "Diffusion-based enhancement"
        text: "Generative enhancement brought its own problems: slow reverse diffusion and unreliable conditioning on noisy features. Joint generative and predictive decoders gave faster decoding and higher PESQ than StoRM and SGMSE+ on Voice-Bank. Ensemble inference exploited the sampling behavior of diffusion, with SplitTree reducing its complexity by about 40% at a similar level of performance. DERDM-SE then used deterministic features as conditions, despite the distortion those models introduce, and gave more stable performance than other diffusion-based models on CHiME-4."
        papers: [icassp-2024-shi, hscma-2024-shi, trans2025_shi]
      - when: "2025–2026"
        title: "Observation addition between enhancement and ASR"
        text: "Observation addition balances noisy and enhanced speech without changing the enhancement or ASR models. Collaborative work trained the module that sets this balance on real noisy speech, and later derived the fusion weights from intelligibility estimates of the ASR back-end, which removes the need for a trained predictor."
        papers: [icassp-2025-cui, 2026_interspeech_haoyang]
    insights:
      - text: "Enhancement approaches are complementary in identifiable ways, so combining them has repeatedly been more effective than choosing one."
        papers: [apsipa-2021-shi, apsipa-2022-shi-subband, taslp-2024-shi, icassp-2024-shi]
      - text: "Listening quality and recognition accuracy are related but separate targets. A front-end should be judged partly by what it preserves for the back-end, not only by how much noise it removes."
        papers: [taslp-2024-shi, icassp-2025-cui, 2026_interspeech_haoyang]
      - text: "Real data keeps its value for strong pretrained models, as long as adaptation preserves what pretraining learned."
        papers: [report-2023-shi, interspeech-2024-shi, icassp-2025-cui]
    open_questions:
      - "When perceptual metrics and recognition accuracy disagree, how should an enhancement system be evaluated for a given downstream use?"
      - "Can generative enhancement be prevented from producing speech detail that the recording does not support, and how would this be measured?"
      - "How well do results on benchmarks such as CHiME-4 and Voice-Bank carry over to other real recording conditions?"
    papers: [trans2025_shi, taslp-2024-shi, interspeech-2024-shi, icassp-2024-shi]
  - id: attribution
    number: "02"
    name: "Evidence Attribution"
    short: "Multi-Talker"
    subtitle: "Multi-Talker & Speaker-Grounded Speech"
    tagline: "Understand what was said, who said it, and which acoustic evidence belongs to which source in overlapping speech scenes."
    challenge: "How can speech models distinguish, attribute, and preserve acoustic evidence from overlapping speakers?"
    keywords: [Multi-Talker ASR, Speaker Grounding, Separation / TSE]
    overview: "In meetings and multi-party dialogue, a system can produce fluent text and still mix content across speakers, miss a weak target speaker, or hallucinate who said what. This work uses serialized output training (SOT) and asks how each part of the output can stay tied to the right talker's evidence."
    highlights:
      - text: "Letting LLM layers query serialized acoustic memory throughout generation gave consistent improvements over static-prefix prompting on LibriMix."
        papers: [2026-taslp-shi]
        representative: true
      - text: "An encoder-only model with distilled LLM guidance was comparable to LLM-based systems with two talkers and significantly better with three, at a much smaller real-time factor."
        papers: [2026_interspeech_shi]
      - text: "Serialized output prompts significantly improved LLM-based recognition in both two- and three-talker conditions."
        papers: [asru-2025-shi]
    questions:
      - "How should talker-specific evidence be extracted from a mixture and organized so that it matches a serialized output?"
      - "Is richer acoustic content in the prompt enough, or does the decoder need access to evidence throughout generation?"
      - "Can the semantic priors of LLMs be retained without the cost and fragility of autoregressive decoding?"
    evolution:
      - when: "2024"
        title: "Extracting speaker-specific acoustic evidence"
        text: "SOT is not easy to train with attention loss alone. EncSep inserted a separator after the encoder, trained with CTC losses, and GEncSep concatenated the separated streams to guide attention during decoding, reaching more than 12% and 9% relative improvement on the noisy Libri2Mix and Libri3Mix evaluation sets."
        papers: [slt-2024-shi]
      - when: "2025"
        title: "Representing evidence for language models"
        text: "With an LLM decoder, SOT worked well for two talkers but did not fully use the LLM for three. Serialized output prompts used a separator with serialized CTC to extract each talker's content in speaking order, then gave the decoded text to the LLM as a structured prompt. This improved both conditions, although the evidence is still supplied before generation begins."
        papers: [asru-2025-shi]
      - when: "2026"
        title: "Maintaining access to acoustic evidence"
        text: "This study first tested whether a static prefix could be enriched with CTC tokens, hybrid prompts, or continuous talker representations. The results suggested that acoustic content alone does not fully address the conditioning bottleneck. Talker-specific representations were therefore kept as serialized acoustic memory in onset order, which LLM layers query through gated residual cross-attention, with consistent improvements on LibriMix."
        papers: [2026-taslp-shi]
      - when: "2026"
        title: "Exploring alternatives to autoregressive decoding"
        relation: "Parallel approach"
        text: "This work does not extend acoustic memory. It addresses the cost and fragility of an autoregressive LLM decoder instead. An adapted LLM acts as a teacher signal during training and distills semantic guidance into the encoder, while inference keeps fast CTC-style decoding. A Talker-Count Head selects the decoding branch for variable numbers of talkers. On LibriMix, the model was comparable to LLM-based systems with two talkers and significantly better with three."
        papers: [2026_interspeech_shi]
    evolution_title: "Research Progression"
    evolution_note: "The first three studies address successive questions about how evidence reaches the decoder. The fourth is a parallel approach. All four are separate studies that share a benchmark and a separator design, not stages of one pipeline."
    insights:
      - text: "The talker count is where LLM decoding strains. Across these studies, systems that do well with two talkers need more support with three."
        papers: [asru-2025-shi, 2026-taslp-shi, 2026_interspeech_shi]
      - text: "How evidence is exposed matters as well as what it contains: effective LLM-based multi-talker ASR appears to depend on persistent access to evidence structured according to the serialized output."
        papers: [asru-2025-shi, 2026-taslp-shi]
      - text: "Explicit separation after the encoder has remained part of these systems as the decoder changed, from attention-based SOT to LLM prompting and encoder-only models."
        papers: [slt-2024-shi, asru-2025-shi, 2026_interspeech_shi]
    open_questions:
      - "How do these approaches behave on real conversations rather than on mixtures such as LibriMix?"
      - "How should the binding between speakers and content be evaluated beyond WER and DER?"
      - "Can a speech LLM represent who said what explicitly, so that a wrong attribution can be detected?"
    ongoing: 'I am co-organizing the ICASSP 2027 special session <a href="https://hshi-speech.github.io/ICASSP-2027-Special-Session/">Speaker Grounding in Speech LLMs</a>, which covers recognition, attribution, and understanding in multi-talker scenes, and how speaker-content binding should be evaluated beyond WER and DER.'
    papers: [2026-taslp-shi, 2026_interspeech_shi, asru-2025-shi, slt-2024-shi]
  - id: grounded
    number: "03"
    name: "Speech–Language Alignment & Grounding"
    short: "Speech-Language"
    subtitle: "Speech-Language Modeling"
    tagline: "Use linguistic knowledge in speech and language models while preserving pronunciation, spoken-language properties, and acoustic fidelity."
    challenge: "How can speech and language models exploit linguistic knowledge while preserving pronunciation, spoken-language properties, and acoustic fidelity?"
    keywords: [Pronunciation-Aware ASR, Speech Language Models, Speech Generation]
    overview: "Speech systems built on text LLMs or supervised with written text inherit assumptions from written language. The shared question here is where those assumptions conflict with speech, mostly in Japanese, where one written form can have several readings. The work has two strands. Pronunciation and acoustic fidelity concerns the signal directly; spoken-language adaptation addresses the mismatch between written and spoken language more broadly."
    highlights:
      - text: "Binding each written span to its realized reading in the recognition target improved lexical-reading recovery across five Japanese benchmarks without sacrificing readable transcription."
        papers: [2026-shi-ruby]
        representative: true
        project: ruby-asr
      - text: "Targeted data covering all 2,136 Joyo kanji significantly improved reading accuracy in Japanese TTS, measured with a new benchmark and the Kana-CER metric."
        papers: [report-2026-liu]
      - text: "Preference-based alignment gave substantial improvement on the new SpokenElyza benchmark while largely preserving written-style performance."
        papers: [2026_interspeech_mengjie]
    questions:
      - "How should supervision preserve what was actually said when orthographic text does not encode it?"
      - "How can pronunciation correctness be measured directly, independently of orthographic variation?"
      - "How can speech models be aligned to spoken style and conversational context?"
      - "How does the robustness of a text LLM relate to that of the speech language model built on it?"
    evolution_title: "Research Strands"
    strands:
      - title: "Pronunciation & Acoustic Fidelity"
        intro: "Whether a model's output stays tied to what was actually said."
        items:
          - when: "Q1"
            title: "Reading in recognition"
            text: "One written form can correspond to different readings. Ruby-ASR uses a span-bound target from which orthography and reading can both be recovered deterministically, since the distinction cannot be recovered reliably by text-only conversion afterwards. This improved reading recovery across five benchmarks."
            papers: [2026-shi-ruby]
          - when: "Q2"
            title: "Reading in generation"
            text: "Sarashina2.2-TTS faces the same ambiguity in generation. It introduces the Joyo Kanji Yomi Benchmark (2,136 kanji, 4,378 readings) and Kana-CER, and the paper reports state-of-the-art kanji-level reading accuracy."
            papers: [report-2026-liu]
          - when: "Related"
            title: "LLM priors in multi-talker recognition"
            text: "The LLM-based multi-talker papers also belong here, because they test the tension between linguistic priors and acoustic evidence most directly. They are described under Evidence Attribution."
            papers: [asru-2025-shi, 2026-taslp-shi, 2026_interspeech_shi]
      - title: "Spoken-Language Adaptation"
        intro: "How models built on written language adapt to the way language is spoken. This work does not address acoustic grounding directly."
        items:
          - when: "Q3"
            title: "Spoken style and context"
            text: "Two collaborative studies use preference optimization: one for speech-worthy SpeechLLM output, evaluated on the new SpokenElyza benchmark, and one over discrete units for contextually appropriate emotional expression in conversational TTS, where emotion recognition accuracy on STUDIES rose from 48.45% to 67.14%."
            papers: [2026_interspeech_mengjie, apsipa-2025-kojima]
          - when: "Q4"
            title: "Dialect robustness"
            text: "This evaluation compares LLMs and speech language models on Japanese dialects, defining robustness as the ratio of performance on dialectal versus standard inputs. Robustness correlated between speech models and their text-based counterparts, and training with dialectal data and fine-tuning the speech encoder each improved it."
            papers: [asru_2025_mizumoto]
    evolution_note: "Q numbers refer to the research questions above. The strands developed in parallel rather than as a sequence."
    insights:
      - text: "What a written target leaves out may not be recoverable from text afterwards, so it has to be represented in the supervision or measured directly, as in the kana-space evaluation of reading."
        papers: [2026-shi-ruby, report-2026-liu]
      - text: "Properties of spoken language can respond to preference optimization where standard training falls short, in both text output and speech output."
        papers: [2026_interspeech_mengjie, apsipa-2025-kojima]
      - text: "Speech models carry over behavior from the text models they are built on, such as written-style output and dialect robustness."
        papers: [2026_interspeech_mengjie, asru_2025_mizumoto]
    insights_note: "These are readings across separate studies, not established general rules."
    open_questions:
      - "Could span-bound supervision extend to other properties of speech that orthography omits, and to languages other than Japanese?"
      - "How much of a speech language model's dialect robustness comes from the base LLM, and how much from the speech components?"
      - "How can output that is plausible but unsupported by the acoustics be detected in speech LLMs?"
    papers: [2026-shi-ruby, report-2026-liu, 2026_interspeech_mengjie, asru_2025_mizumoto]
