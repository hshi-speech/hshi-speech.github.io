# Projects grouped by topic. Same row + Expand pattern as publications.
# Item fields: id, title, kind (what is available), role, summary, example, figure, panel_figure, links, details.
# `example` shows a task and a real output. Quote it from a released source; never write one by hand.

- group: Multi-Talker ASR
  items:
  - id: multi-talker-llm
    title: Multi-Talker ASR with LLMs
    kind: Open-source implementation
    summary: LLM-based multi-talker ASR with serialized output training on mixture speech.
    example:
    - label: Task
      text: 'One mixture of N overlapping speakers in, all N transcriptions out as one serialized token sequence, separated by a <code>&lt;sc&gt;</code> token.'
    figure: /assets/figures/asru-2025-shi.webp
    links:
      code: https://github.com/hshi-speech/Multi-talker-ASR-with-LLMs
      paper: /publications/#asru-2025-shi
    details:
    - label: Background
      text: 'Implements the systems of the ASRU 2025 and SLT 2024 papers: an audio mixture of overlapping speakers is encoded by a WavLM front-end, with an optional separator splitting encoder features into per-speaker streams supervised by serialized CTC.'
- group: Japanese ASR
  items:
  - id: ruby-asr
    title: Ruby-ASR
    kind: Research project · Released model
    role: Japanese ASR with reading-aware output
    summary: 'One model, two complementary outputs: actual-pronunciation kana morae and transcripts with inline bracket furigana.'
    example:
    - label: Mora reading
      text: ナナネンカンデロスニモトモダチデキタシ
      ja: true
    - label: Ruby output
      text: 七[なな]年間[ねんかん]でロスにも友達[ともだち]できたし、
      ja: true
    figure: /assets/figures/2026-shi-ruby.webp
    links:
      code: https://github.com/hshi-speech/Ruby-ASR-1.7B
      models: https://huggingface.co/hshispeech/Ruby-ASR-1.7B
      paper: /publications/#2026-shi-ruby
    details:
    - label: Background
      text: Built on Qwen3-ASR-1.7B. A written form can correspond to different lexical readings in speech, and that distinction is lost under purely orthographic supervision.
    - label: Release
      text: The main model stays byte-compatible with stock Qwen3-ASR, so ruby transcription runs on unmodified vLLM and the official qwen-asr toolkit. Mora reading uses the auxiliary CTC branch through the small ruby_asr package.
  - id: kana-whisper
    title: Kana Whisper
    kind: Released model
    role: Co-author · SB Intuitions
    summary: A fine-tuned Whisper large-v3-turbo that transcribes Japanese speech directly into katakana sequences.
    example:
    - label: Example output
      text: キョーワイイテンキデスネ
      ja: true
    figure: /assets/figures/kana-whisper.webp
    links:
      models: https://huggingface.co/sbintuitions/kana-whisper
      benchmark: https://github.com/sbintuitions/JoyoKanji-Yomi-Benchmark
      paper: /publications/#report-2026-liu
    details:
    - label: Background
      text: The ASR component of the Joyo Kanji Yomi Benchmark, developed as part of the Sarashina2.2-TTS project. It is the backbone of the Kana CER metric, which evaluates the kanji-level reading accuracy of Japanese TTS systems.
- group: Text-to-Speech
  items:
  - id: iroha-tts
    title: Iroha-TTS
    kind: Released model · Interactive demo
    role: Iroha Studio
    summary: 'Expressive Japanese TTS for character dialogue: clone a voice, choose an emotion, adjust its intensity, and explore different takes on the same line.'
    figure: /assets/figures/iroha-tts.webp
    panel_figure: /assets/figures/iroha-tts-emotions.webp
    links:
      models: https://huggingface.co/IrohaStudio/Iroha-TTS
      demo: https://huggingface.co/spaces/cyacya8023/Iroha-TTS
      blog: https://irohastudios.github.io/blog/irohattsv1/en/
    details:
    - label: Background
      text: Built on Fish Audio S2-Pro with supervised fine-tuning and reinforcement learning. Weights are released for research and non-commercial use under the Fish Audio Research License.
    - label: Features
      text: Emotion tags with adjustable intensity, mood changes within one generation, voice cloning from a short reference recording, non-verbal sounds such as laughter and sighs, whispering, and kana annotations that specify the reading of names and heteronyms.
    - label: Results
      text: 'As reported on the model card: 85.6% emotion accuracy (emo2vec large) against 17.9% for the original Fish S2 Pro, and a subjective Japanese MOS of 3.85 against 3.47.'
  - id: sarashina-tts
    title: Sarashina2.2-TTS
    kind: Research project · Released model · Audio samples
    role: Co-author · SB Intuitions
    summary: Japanese-centric LLM-based TTS tackling kanji polyphony, released with the Joyo Kanji Yomi Benchmark.
    figure: /assets/figures/report-2026-liu.webp
    links:
      code: https://github.com/sbintuitions/sarashina2.2-tts
      models: https://huggingface.co/sbintuitions/sarashina2.2-tts
      audio: https://huggingface.co/sbintuitions/sarashina2.2-tts#audio-samples
      benchmark: https://github.com/sbintuitions/JoyoKanji-Yomi-Benchmark
      paper: /publications/#report-2026-liu
    details:
    - label: Background
      text: Trained on approximately 361k hours of Japanese and English speech, with targeted data covering all 2,136 Joyo kanji. The benchmark covers their 4,378 readings and is scored with Kana-CER, which compares synthesized speech to reference readings in kana space.
