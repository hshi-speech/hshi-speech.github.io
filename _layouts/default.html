<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>document.documentElement.className = 'js';</script>
  {% seo %}
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead">
    <a class="wordmark" href="{{ '/' | relative_url }}">Hao Shi <span lang="zh">史 昊</span></a>
    <nav aria-label="Main">
      {% for item in site.data.nav %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url or page.nav_parent == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </header>
  <main id="main">
    {{ content }}
  </main>
  <footer class="colophon">
    <span>© {{ site.time | date: '%Y' }} Hao Shi</span>
    <span><a href="mailto:hshi@ieee.org">hshi@ieee.org</a></span>
    <span>Updated {{ site.time | date: '%B %Y' }}</span>
  </footer>
  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
